# Satış sitesini (webapp/site.html) GitHub Pages'e yayınlar: https://stars.siyahkare.com
# İletişim ve ödeme linkleri pages/site-config.json içinde (Pages'te /api/config yok).
name: pages
on:
  push:
    branches: [main]
    paths: ["webapp/site.html", "pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siteyi hazırla
        run: |
          mkdir -p _site
          cp webapp/site.html _site/index.html
          cp pages/* _site/
          python3 -c "import json; json.load(open('_site/site-config.json'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
