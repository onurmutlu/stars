services:
  shop:
    build: .
    env_file: .env
    environment:
      DB_PATH: /srv/data/shop.sqlite3
      PRODUCTS_PATH: /srv/products.json
    volumes:
      - ./products.json:/srv/products.json:ro
      - shop-data:/srv/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Tek replika çalıştır: SQLite tek süreç içindir.
volumes:
  shop-data:
