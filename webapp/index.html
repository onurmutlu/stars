<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Stars Mağaza</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" id="shop-logo" aria-hidden="true">⭐</div>
      <div>
        <h1 id="shop-name">Stars Mağaza</h1>
        <p class="tagline" data-i18n="tagline">Telegram Stars ile güvenli ödeme · anında teslim</p>
      </div>
      <button class="admin" id="admin" type="button" hidden data-i18n="admin">⚙️ Yönetim</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="shop" role="tab" aria-selected="true"><span data-i18n="tab_shop">Mağaza</span></button>
      <button class="tab" data-tab="library" role="tab" aria-selected="false"><span data-i18n="tab_library">Satın aldıklarım</span> <span class="count" id="library-count" hidden></span></button>
    </nav>
  </header>

  <main>
    <section id="view-shop" class="view">
      <div class="tools" id="tools" hidden>
        <input id="search" class="search" type="search" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="search">
        <div class="chips" id="chips" role="tablist"></div>
      </div>
      <div id="products" class="grid" aria-live="polite"></div>
      <button class="buy-banner" id="buy-banner" type="button" hidden>
        <span class="buy-icon" aria-hidden="true">🛒</span>
        <span id="buy-text"></span>
        <span aria-hidden="true">›</span>
      </button>
    </section>

    <section id="view-detail" class="view" hidden>
      <article class="detail">
        <div class="hero" id="detail-hero"></div>
        <div class="detail-body">
          <div class="tags" id="detail-tags"></div>
          <h2 id="detail-title"></h2>
          <p class="price big" id="detail-price"></p>
          <p class="desc" id="detail-desc"></p>
          <ul class="facts" id="detail-facts"></ul>
          <div class="detail-actions">
            <button class="btn wide" id="detail-buy"></button>
            <button class="btn ghost wide" id="detail-share" hidden data-i18n="share">Paylaş</button>
          </div>
        </div>
      </article>
    </section>

    <section id="view-library" class="view" hidden>
      <div id="library" class="list" aria-live="polite"></div>
    </section>

    <section id="view-content" class="view" hidden>
      <article class="card content-card">
        <span class="badge ok" data-i18n="owned">Aktif</span>
        <h2 id="content-title"></h2>
        <p class="muted" id="content-meta"></p>
        <div id="content-body" class="content-body"></div>
      </article>
    </section>

    <div id="outside" class="empty" hidden data-i18n="outside">Bu mağaza Telegram içinden açılmalı.</div>
  </main>

  <footer class="foot">
    <button class="link" id="support" data-i18n="support">Ödeme desteği</button>
    <span aria-hidden="true">·</span>
    <button class="link" id="terms" data-i18n="terms">Koşullar</button>
    <span class="foot-item" id="fi-admin" hidden><span aria-hidden="true">·</span><button class="link" id="foot-admin" data-i18n="foot_admin">Yönetim paneli</button></span>
    <span class="foot-item" id="fi-license" hidden><span aria-hidden="true">·</span><button class="link" id="foot-license" data-i18n="foot_license">Lisans yönetimi</button></span>
    <span class="foot-item" id="fi-buy" hidden><span aria-hidden="true">·</span><button class="link" id="foot-buy" data-i18n="foot_buy">Sen de mağaza aç</button></span>
    <span id="powered" class="powered" hidden></span>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
