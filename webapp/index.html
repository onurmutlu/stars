<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Stars Mağaza</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1 id="shop-name">Stars Mağaza</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="shop" role="tab" aria-selected="true" data-i18n="tab_shop">Mağaza</button>
      <button class="tab" data-tab="library" role="tab" aria-selected="false" data-i18n="tab_library">Satın aldıklarım</button>
    </nav>
  </header>

  <main>
    <section id="view-shop" class="view">
      <div id="products" class="grid" aria-live="polite"></div>
    </section>
    <section id="view-library" class="view" hidden>
      <div id="library" class="list" aria-live="polite"></div>
    </section>
    <section id="view-content" class="view" hidden>
      <button class="link back" id="back" data-i18n="back">‹ Geri</button>
      <article class="card content-card">
        <h2 id="content-title"></h2>
        <p class="muted" id="content-meta"></p>
        <div id="content-body" class="content-body"></div>
      </article>
    </section>
    <div id="outside" class="empty" hidden data-i18n="outside">Bu mağaza Telegram içinden açılmalı.</div>
  </main>

  <footer class="foot">
    <button class="link" id="support" data-i18n="support">Ödeme desteği</button>
    <span aria-hidden="true">·</span>
    <button class="link" id="terms" data-i18n="terms">Koşullar</button>
    <span id="powered" class="powered" hidden></span>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
